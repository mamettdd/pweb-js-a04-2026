<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk - Mini Shopee</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="nav-brand">🛒 Mini Shopee</div>
        <div class="nav-tools">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Cari produk atau kategori...">
            </div>
            <div class="cart-status">
                <button id="btn-cart" class="btn-cart">
                    Keranjang <span id="cart-badge" class="badge">0</span>
                </button>
            </div>
            <div class="user-profile">
                <span>Halo, <strong id="user-display-name">User</strong></span>
                <button id="btn-logout" class="btn-logout">Keluar</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Filter & Sorting Controls -->
        <section class="controls-bar">
            <div class="filter-group">
                <select id="category-filter">
                    <option value="">Semua Kategori</option>
                    <!-- Kategori akan diisi secara dinamis dari JS -->
                </select>

                <select id="sort-filter">
                    <option value="">Urutkan</option>
                    <option value="price-asc">Harga: Termurah ke Termahal</option>
                    <option value="price-desc">Harga: Termahal ke Termurah</option>
                    <option value="rating-desc">Rating: Tertinggi</option>
                </select>
            </div>
            <div id="product-count-info" class="count-info">
                Menampilkan 0 produk
            </div>
        </section>

        <!-- Global Error State -->
        <div id="global-error" class="alert-error" style="display: none;"></div>

        <!-- Global Loading State -->
        <div id="global-loading" class="loading-spinner-box" style="display: none;">
            <div class="spinner"></div>
            <p>Memuat produk...</p>
        </div>

        <!-- Product Grid Catalog -->
        <section id="product-grid" class="product-grid">
            <!-- Kartu produk akan di-render di sini oleh JavaScript -->
        </section>

        <!-- Load More Section -->
        <div class="load-more-wrapper">
            <button id="btn-load-more" class="btn-load-more" style="display: none;">Muat lebih banyak</button>
        </div>
    </main>

    <!-- Modal Detail Produk -->
    <div id="product-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <button id="modal-close" class="modal-close">&times;</button>
            <div id="modal-body" class="modal-body">
                <!-- Detail produk di-render dinamis -->
            </div>
        </div>
    </div>

    <!-- Modal Keranjang Belanja -->
    <div id="cart-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card cart-modal-card">
            <button id="cart-modal-close" class="modal-close">&times;</button>
            <div class="cart-modal-header">
                <h3>🛒 Keranjang Belanja</h3>
            </div>
            <div id="cart-items-container" class="cart-items-container">
                <!-- Daftar item keranjang akan di-render di sini -->
            </div>
            <div class="cart-modal-footer">
                <div class="cart-total">
                    <span>Total Harga:</span>
                    <strong id="cart-total-price">$0.00</strong>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
